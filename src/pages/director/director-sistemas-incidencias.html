<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap-reboot.min.css">  <!--PASE LOS IMPORTS A LINKS EN LOS HTML PARA DISMINUIR FOUC-->
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/src/css/style.css">

    
</head>

<body>
    
    <header id="plantilla"></header>

    <div class="main-container">
        <nav class="menu-lateral">
            <ul>
                
                <li>
                    <a href="director-sistemas-dashboard.html">Dashboard</a>
                </li>
                <li>
                    <a href="director-sistemas-incidencias.html">Incidencias</a>
                </li>
                <li>
                    <a href="../../../index.html" class="active" aria-current="page" href="#">Salir</a>
                </li>
            </ul>
        </nav>

        <div class="right-container">
            <main>

                <div class="container-fluid">
                    <div class="mb-4">
                        <h2 class="fw-bold mb-1">Incidencias</h2>
                        <p class="text-muted mb-0">Gestión y supervisión de las incidencias.</p>
                    </div>

                    <div class="filtros-incidencias d-flex justify-content-end gap-2 mb-3">
                        <div class="dropdown filtro-incidencia-dropdown">
                            <button class="btn btn-outline-secondary btn-sm dropdown-toggle filtro-incidencia-trigger"
                                type="button" id="dropdown-filtro-prioridad" data-bs-toggle="dropdown" aria-expanded="false">
                                <span class="filtro-incidencia-text" id="texto-filtro-prioridad">Prioridad: Todas</span>
                            </button>
                            <ul class="dropdown-menu" id="menu-filtro-prioridad" aria-labelledby="dropdown-filtro-prioridad">
                                <li><button class="dropdown-item active" type="button" data-valor="todas" data-etiqueta="Prioridad: Todas">Todas</button></li>
                                <li><button class="dropdown-item" type="button" data-valor="1" data-etiqueta="Prioridad: Baja">Baja</button></li>
                                <li><button class="dropdown-item" type="button" data-valor="2" data-etiqueta="Prioridad: Media">Media</button></li>
                                <li><button class="dropdown-item" type="button" data-valor="3" data-etiqueta="Prioridad: Alta">Alta</button></li>
                            </ul>
                        </div>

                        <div class="dropdown filtro-incidencia-dropdown">
                            <button class="btn btn-outline-secondary btn-sm dropdown-toggle filtro-incidencia-trigger"
                                type="button" id="dropdown-filtro-estado" data-bs-toggle="dropdown" aria-expanded="false">
                                <span class="filtro-incidencia-text" id="texto-filtro-estado">Estado: Todos</span>
                            </button>
                            <ul class="dropdown-menu" id="menu-filtro-estado" aria-labelledby="dropdown-filtro-estado">
                                <li><button class="dropdown-item active" type="button" data-valor="todas" data-etiqueta="Estado: Todos">Todos</button></li>
                                <li><button class="dropdown-item" type="button" data-valor="1" data-etiqueta="Estado: Pendiente">Pendiente</button></li>
                                <li><button class="dropdown-item" type="button" data-valor="2" data-etiqueta="Estado: En proceso">En proceso</button></li>
                                <li><button class="dropdown-item" type="button" data-valor="3" data-etiqueta="Estado: Resuelta">Resuelta</button></li>
                                <li><button class="dropdown-item" type="button" data-valor="4" data-etiqueta="Estado: Cancelada">Cancelada</button></li>
                            </ul>
                        </div>
                    </div>




                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead>
                                <tr>
                                    <th scope="col">#</th>
                                    <th scope="col">Artículo</th>
                                    <th scope="col">Prioridad</th>
                                    <th scope="col">Estado</th>
                                    <th scope="col">Técnico asignado</th>
                                    <th scope="col">Fecha</th>
                                    <th scope="col">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-incidencias-director"></tbody>
                        </table>
                    </div>

                    <div class="modal" id="modalIncidencia" tabindex="-1">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title">Incidencia #<span id="modal-id"></span></h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                </div>
                                <div class="modal-body">
                                    <p><strong>Artículo:</strong> <span id="modal-articulo"></span></p>
                                    <p><strong>Pedido:</strong> <span id="modal-descripcion"></span></p>
                                    <div class="mb-2">
                                        <label for="select-tecnico" class="form-label">Asignar a:</label>
                                        <select class="form-select" id="select-tecnico">
                                            <option value="" selected disabled>Cargando técnicos...</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button id="btn-asignar" class="btn btn-primary">Asignar</button>
                                    <button id="btn-cancelar" class="btn btn-danger">Cancelar incidencia</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <nav aria-label="Paginación de incidencias">
                        <ul id="paginacion-incidencias-director" class="pagination pagination-sm justify-content-center"></ul>
                    </nav>
                </div>
            </main>
            <!-- <footer>
            </footer> -->
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/pages/director/director-sistemas-incidencias.js"></script>
     <script type="module">
    import { mostrarHeader } from '../../header.js';
    mostrarHeader('DIRECTOR');
    </script>
    
    
</body>

</html>
