<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap-reboot.min.css">  <!--PASE LOS IMPORTS A LINKS EN LOS HTML PARA DISMINUIR FOUC-->
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/src/css/style.css">

    
</head>

<body>
    
    <header id="plantilla"></header>

    <div class="main-container">
        <nav class="menu-lateral">
            <ul>
                
                <li>
                    <a href="director-sistemas-dashboard.html">Dashboard</a>
                </li>
                <li>
                    <a href="director-sistemas-incidencias.html">Incidencias</a>
                </li>
                <li>
                    <a href="../../../index.html" class="active" aria-current="page" href="#">Salir</a>
                </li>
            </ul>
        </nav>

        <div class="right-container">
            <main>

                <div class="container-fluid">
                    <div class="mb-4">
                        <h2 class="fw-bold mb-1">Incidencias</h2>
                        <p class="text-muted mb-0">Gestión y supervisión de las incidencias.</p>
                    </div>

                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th scope="col">#</th>
                                <th scope="col">Artículo</th>
                                <th scope="col">Prioridad</th>
                                <th scope="col">Estado</th>
                                <th scope="col">Técnico asignado</th>
                                <th scope="col">Fecha</th>
                                <th scope="col">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-incidencias-director"></tbody>
                    </table>
                </div>

                <div class="modal" id="modalIncidencia" tabindex="-1">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">Incidencia #<span id="modal-id"></span></h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <p><strong>Artículo:</strong> <span id="modal-articulo"></span></p>
                                <p><strong>Pedido:</strong> <span id="modal-descripcion"></span></p>
                            </div>
                            <div class="modal-footer">
                                <button id="btn-asignar" class="btn btn-primary">Asignar</button>
                                <button id="btn-cancelar" class="btn btn-danger">Cancelar incidencia</button>
                            </div>
                        </div>
                    </div>
                </div>

                <nav aria-label="Paginación de incidencias">
                    <ul id="paginacion-incidencias-director" class="pagination pagination-sm justify-content-center"></ul>
                </nav>
            </main>
            <!-- <footer>
            </footer> -->
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/pages/director/director-sistemas-incidencias.js"></script>
     <script type="module">
    import { mostrarHeader } from '../../header.js';
    mostrarHeader('DIRECTOR');
    </script>
    
    
</body>

</html>
