<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap-reboot.min.css">
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/src/css/style.css">

    
</head>

<body>

    <header id="plantilla"></header>

    <div class="main-container">
        <nav class="menu-lateral">
            <ul>                
                <li>
                    <a href="empleado-sistemas-incidencias.html">Incidencias</a>
                </li>
                <li>
                    <a href="empleado-sistemas-categorias.html">Categorías</a>
                </li>
                <li>
                    <a href="empleado-sistemas-articulos.html">Artículos</a>
                </li>
                <li>
                    <a href="../../../index.html" class="active" aria-current="page" href="#">Salir</a>
                </li>
            </ul>
        </nav>


        <div class="right-container">
            <main>
                <div class="container text-center">                    
                    <div class="row">
                        <div class="col-auto me-auto">
                            <h3>Categorías</h3>
                        </div>
                        <div class="col-auto">
                            <button type="button" class="btn btn-primary mt-auto w-auto" id="btn-nueva">Nueva</button>
                        </div>
                    </div>


                    <form id="form-nueva-categoria" class="row g-2 align-items-end mb-3 d-none">
                        <div class="col">
                            <label for="descripcion-nueva" class="form-label">Descripción</label>
                            <input
                                type="text"
                                id="descripcion-nueva"
                                name="descripcion"
                                class="form-control"
                                required
                            >
                        </div>

                        <div class="col-auto">
                            <button type="submit" class="btn btn-success">Guardar</button>
                            <button type="button" id="btn-cancelar-nueva" class="btn btn-outline-secondary">
                                    Cancelar
                            </button>
                        </div>
                    </form>
                
                
                    <table class="table">
                        <thead>
                            <tr>
                            <th scope="col">#</th>
                            <th scope="col">Descrición</th>
                            <th scope="col">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="categorias-body"></tbody>
                    </table>

                    <nav aria-label="Paginación de categorías">
                        <ul id="paginacion-categorias"
                            class="pagination pagination-sm justify-content-center">
                        </ul>
                            
                    </nav>
                </div>
                <div class="modal fade" id="modal-editar-categoria" tabindex="-1"
                    aria-labelledby="titulo-modal-editar" aria-hidden="true">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <form id="form-editar-categoria">
                                <div class="modal-header">
                                    <h5 class="modal-title" id="titulo-modal-editar">
                                        Editar categoría
                                    </h5>
                                    <button type="button" class="btn-close"
                                        data-bs-dismiss="modal" aria-label="Cerrar">
                                    </button>
                                </div>

                                <div class="modal-body">
                                    <input type="hidden" id="id-categoria-editar">

                                    <label for="descripcion-editar" class="form-label">
                                        Descripción
                                    </label>
                                    <input type="text" id="descripcion-editar"
                                        class="form-control" required>
                                </div>

                                <div class="modal-footer">
                                    <button type="button" class="btn btn-outline-secondary"
                                        data-bs-dismiss="modal">
                                        Cancelar
                                    </button>
                                    <button type="submit" class="btn btn-primary">
                                        Guardar cambios
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>




                <div class="modal fade" id="modal-confirmar-eliminar" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Confirmar eliminación</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>

            <div class="modal-body">
                <p id="mensaje-confirmacion">¿Desactivar la categoría?</p>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    Cancelar
                </button>
                <button type="button" class="btn btn-danger" id="btn-confirmar-eliminar">
                    Desactivar
                </button>
            </div>
        </div>
    </div>
</div>
            </main>
            <!-- <footer>
            </footer> -->
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
    <script type="module">
    import { mostrarHeader } from '../../header.js';
    mostrarHeader('EMPLEADO SISTEMAS');
    </script>
    <script type="module" src="./empleado-sistemas-categorias.js"></script>
    
</body>

</html>
