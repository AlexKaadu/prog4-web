    <meta charset="UTF-8">

    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/node_modules/bootstrap-icons/font/bootstrap-icons.css">   
    <link rel="stylesheet" href="/src/css/style.css">
</head>
    
<body>

    <header id="plantilla"></header>

    <!-- Menú + Contenido -->
    <div class="main-container">

        <!-- Menú -->
        <nav class="menu-lateral">
            <ul>
                <li>
                    <a href="./empleado-municipal-articulos.html" class="active" aria-current="page" >Artículos</a>

                <li>
                    <a href="./empleado-municipal-incidencias.html">Incidencias</a>
                </li>
                <li>
                    <a href="../../../index.html" data-action="logout">Salir</a>
                </li>
            </ul>
        </nav>

        <!-- Contenido principal -->
        <div class="right-container">
            <main>
                
                <!-- Tabla + Filtros -->
                <div class="container-fluid">
                    
                    <!-- Encabezado de la tabla + Filtros -->
                    <div class="row align-items-end mb-3">

                        <!-- Encabezado -->
                        <div class="col-md">
                            <h2 class="fw-bold mb-1">Artículos</h2>
                            <p class="text-muted mb-0">Artículos disponibles para reportar incidencias.</p>
                        </div>

                        <!-- Filtros -->
                        <div class="col-md-6 d-flex gap-3">

                            <input type="search" id="filtro-articulo" class="form-control" placeholder="Buscar por artículo" aria-label="Buscar por artículo">

                            <select id="filtro-categoria" class="form-select" aria-label="Filtrar por categoría">
                                <option value="">Todas las categorías</option>
                            </select>

                        </div>

                    </div>
                
                    <div id="mensaje-articulos" class="alert d-none" role="status" aria-live="polite"></div>

                    <!-- Tabla -->
                    <div class="table-responsive">
                     <table class="table  align-middle tabla-articulos-municipal">

                        <thead>
                            <tr>
                                <th scope="col">Identificador</th>
                                <th scope="col">Artículo</th>
                                <th scope="col">Categoría</th>
                                <th scope="col">Área</th>
                            </tr>
                        </thead>

                        <tbody id="tabla-articulos-datos"></tbody>

                    </table>
                    </div>

                    <nav aria-label="Paginación de artículos">
                        <ul id="paginacion-articulos"
                            class="pagination pagination-sm justify-content-center"></ul>
                    </nav>

                </div>

            </main>
            <!-- <footer>
            </footer> -->
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>

    <script type="module">
