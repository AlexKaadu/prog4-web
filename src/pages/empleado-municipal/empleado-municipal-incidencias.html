<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incidencias</title>
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/src/css/style.css">
</head>

<body>

    <header id="plantilla"></header>

    <!-- Menú + Contenido -->
    <div class="main-container">

        <!-- Menú -->
        <nav class="menu-lateral">
            <ul>
                <li>
                    <a href="./empleado-municipal-articulos.html">Artículos</a>
                </li>
                <li>
                    <a href="./empleado-municipal-nueva-incidencia.html">Nueva Incidencia</a>
                </li>
                <li>
                    <a href="./empleado-municipal-incidencias.html" class="active" aria-current="page">Incidencias</a>
                </li>
                <li>
                    <a href="../../../index.html">Salir</a>
                </li>
            </ul>
        </nav>

        <!-- Contenido principal -->
        <div class="right-container">
            <main>
                
                <!-- Tabla + Filtros -->
                <div class="container-fluid">
                    
                    <!-- Encabezado de la tabla -->
                    <div class="mb-4">
                        <h2 class="fw-bold mb-1">Mis incidencias</h2>
                        <p class="text-muted mb-0">Solo podés cancelar las que están pendientes.</p>
                    </div>
                    
                    <!-- Filtros -->
                    <div class="filtros-incidencias-municipal d-flex justify-content-end gap-2 mb-3">
                        <div class="dropdown filtro-municipal">
                            <button
                                class="btn btn-outline-secondary btn-sm dropdown-toggle"
                                type="button"
                                id="dropdown-filtro-prioridad"
                                data-bs-toggle="dropdown"
                                aria-expanded="false">
                                <span id="texto-filtro-prioridad">Prioridad: Todas</span>
                            </button>

                            <ul class="dropdown-menu" id="menu-filtro-prioridad"
                                aria-labelledby="dropdown-filtro-prioridad">
                                <li>
                                    <button class="dropdown-item active" type="button"
                                        data-prioridad="todas" data-etiqueta="Prioridad: Todas">
                                        Todas
                                    </button>
                                </li>
                                <li>
                                    <button class="dropdown-item" type="button"
                                        data-prioridad="1" data-etiqueta="Prioridad: Baja">
                                        Baja
                                    </button>
                                </li>
                                <li>
                                    <button class="dropdown-item" type="button"
                                        data-prioridad="2" data-etiqueta="Prioridad: Media">
                                        Media
                                    </button>
                                </li>
                                <li>
                                    <button class="dropdown-item" type="button"
                                        data-prioridad="3" data-etiqueta="Prioridad: Alta">
                                        Alta
                                    </button>
                                </li>
                            </ul>
                        </div>

                        <div class="dropdown filtro-municipal">
                            <button
                                class="btn btn-outline-secondary btn-sm dropdown-toggle"
                                type="button"
                                id="dropdown-filtro-estado"
                                data-bs-toggle="dropdown"
                                aria-expanded="false">
                                <span id="texto-filtro-estado">Estado: Todos</span>
                            </button>

                            <ul class="dropdown-menu" id="menu-filtro-estado"
                                aria-labelledby="dropdown-filtro-estado">
                                <li>
                                    <button class="dropdown-item active" type="button"
                                        data-estado="todas" data-etiqueta="Estado: Todos">
                                        Todos
                                    </button>
                                </li>
                                <li>
                                    <button class="dropdown-item" type="button"
                                        data-estado="1" data-etiqueta="Estado: Pendiente">
                                        Pendiente
                                    </button>
                                </li>
                                <li>
                                    <button class="dropdown-item" type="button"
                                        data-estado="2" data-etiqueta="Estado: En proceso">
                                        En proceso
                                    </button>
                                </li>
                                <li>
                                    <button class="dropdown-item" type="button"
                                        data-estado="3" data-etiqueta="Estado: Resuelta">
                                        Resuelta
                                    </button>
                                </li>
                                <li>
                                    <button class="dropdown-item" type="button"
                                        data-estado="4" data-etiqueta="Estado: Cancelada">
                                        Cancelada
                                    </button>
                                </li>
                            </ul>
                        </div>
                    </div>
                    <div id="mensaje-incidencias" class="alert d-none" role="status"></div>

                    <div class="table-responsive">

                        <table class="table  align-middle tabla-incidencias-municipal">

                            <thead>
                                <tr>
                                    <th scope="col">Identificador</th>
                                    <th scope="col">Artículo</th>
                                    <th scope="col">Descripción</th>
                                    <th scope="col">Prioridad</th>
                                    <th scope="col">Creada</th>
                                    <th scope="col">Estado</th>
                                    <th scope="col">Acciones</th>
                                </tr>
                            </thead>

                            <tbody id="tabla-mis-incidencias"></tbody>

                        </table>

                    </div>

                    <nav aria-label = "Paginación de mis incidencias">
                        <ul
                            id="paginacion-mis-incidencias"
                            class="pagination pagination-sm justify-content-center">
                        </ul>
                    </nav>

                </div>

            </main>
            <!-- <footer>
            </footer> -->
        </div>
    </div>




    <div class="modal fade" id="modal-confirmar-cancelacion" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title">Cancelar incidencia</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"
                        aria-label="Cerrar"></button>
                </div>

                <div class="modal-body">
                    <p id="mensaje-confirmar-cancelacion">
                        ¿Estás seguro de cancelar esta incidencia?
                    </p>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        No, volver
                    </button>
                    <button type="button" class="btn btn-danger" id="btn-confirmar-cancelacion">
                        Sí, cancelar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>

    <script type="module">
    import { mostrarHeader } from '../../header.js';
    mostrarHeader('EMPLEADO MUNICIPAL');
    </script>

    <script type="module" src="/src/pages/empleado-municipal/empleado-municipal-incidencias.js"></script>

    s0.parentNode.insertBefore(s1,s0);
    })();
    </script>
    <!--End of Tawk.to Script-->

</body>

</html>
