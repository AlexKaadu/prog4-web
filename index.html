<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Incidencias</title>
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap-reboot.min.css"> <!--PASE LOS IMPORTS A LINKS EN LOS HTML PARA DISMINUIR FOUC-->
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/src/css/style.css">
</head>

<body>

    <main class="login-layout">
        <section class="login-imagen">
            <img src="/assets/MUNI.png" alt="Municipalidad de Concordia">
        </section>

        <section class="login-panel">
            <div class="login-card">
                <h1>¡Bienvenido de nuevo!</h1>

                <form id="form-login">
                    <label for="usuario" class="visually-hidden">Nombre de usuario</label>
                    <input
                        id="usuario"
                        name="usuario"
                        type="text"
                        class="form-control"
                        placeholder="Nombre de usuario"
                        autocomplete="username"
                        required
                    >

                    <label for="contrasenia" class="visually-hidden">Contraseña</label>
                    <input
                        id="contrasenia"
                        name="contrasenia"
                        type="password"
                        class="form-control"
                        placeholder="Contraseña"
                        autocomplete="current-password"
                        required
                    >

                    <button type="submit" class="btn btn-primary">Ingresar</button>
                    <p id="mensaje-login" aria-live="polite"></p>
                </form>
            </div>
        </section>
    </main>

            <!-- <footer>
            </footer> -->
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/login.js"></script>
</body>

</html>
