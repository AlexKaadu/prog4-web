<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Incidencias</title>
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap-reboot.min.css"> <!--PASE LOS IMPORTS A LINKS EN LOS HTML PARA DISMINUIR FOUC-->
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/src/css/style.css">
</head>

<body>
    <header>
        <img class="logo" src="assets/logo-muni.png" alt="Logo Muni">
        
    </header>
    
            <main>
                <div class="container mt-5" style="max-width: 450px;">
    <h1>Iniciar sesión</h1>

    <form id="form-login">
        <div class="mb-3">
            <label for="usuario" class="form-label">Usuario</label>
            <input
                id="usuario"
                name="usuario"
                type="text"
                class="form-control"
                required
            >
        </div>

        <div class="mb-3">
            <label for="contrasenia" class="form-label">Contraseña</label>
            <input
                id="contrasenia"
                name="contrasenia"
                type="password"
                class="form-control"
                required
            >
        </div>

        <button type="submit" class="btn btn-primary">Ingresar</button>
        <p id="mensaje-login" class="mt-3" aria-live="polite"></p>
    </form>
        </div>
            
            </main>
            <!-- <footer>
            </footer> -->
        </div>
    </div>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/login.js"></script>
</body>

</html>
